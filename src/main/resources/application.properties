spring.application.name=OrderService

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
#spring.datasource.password=secret
server.port=${PORT_NO}

jwt.secret=${JWT_SECRET}

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.openfeign.client.config.default.connectTimeout=3000
spring.cloud.openfeign.client.config.default.readTimeout=5000

spring.cloud.openfeign.client.config.ProductService.loggerLevel=basic

resilience4j.retry.instances.productServiceRetry.max-attempts=3
resilience4j.retry.instances.productServiceRetry.wait-duration=500ms

resilience4j.circuitbreaker.instances.productServiceCircuitBreaker.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.productServiceCircuitBreaker.sliding-window-size=5
resilience4j.circuitbreaker.instances.productServiceCircuitBreaker.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.productServiceCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.productServiceCircuitBreaker.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.productServiceCircuitBreaker.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.productServiceCircuitBreaker.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.retry.instances.inventoryServiceRetry.max-attempts=3
resilience4j.retry.instances.inventoryServiceRetry.wait-duration=500ms

resilience4j.retry.instances.inventoryServiceRetry.ignore-exceptions=com.ecommerceproject.orderservice.exceptions.InsufficientStockException